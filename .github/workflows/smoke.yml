name: Example smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    runs-on: macos-latest
    env:
      AXIOM_REFERRAL_CODE: ${{ secrets.AXIOM_REFERRAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require private-alpha CI access
        run: |
          if [ -z "$AXIOM_REFERRAL_CODE" ]; then
            echo 'Set the AXIOM_REFERRAL secret on this repository before running the manual smoke job.' >&2
            exit 1
          fi
      - name: Install verified Axiom CLI archive
        run: |
          archive="$RUNNER_TEMP/axiom-macos-arm64.tar.gz"
          curl -fsSL https://github.com/AxiomCore/AxiomCore/releases/download/v0.147.0/axiom-macos-arm64.tar.gz -o "$archive"
          printf '%s  %s\n' '0b67a85e510bbb4b7681d3079f6ada1c0ed89b9f87413e2022552e87356f8426' "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axiom-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/axiom-bin"
          echo "$RUNNER_TEMP/axiom-bin" >> "$GITHUB_PATH"
      - name: Validate and compare domain example
        working-directory: domain-commerce
        run: |
          axiom domain validate commerce-v1.acore
          axiom diff commerce-v1.acore commerce-v2.acore --format semantic
