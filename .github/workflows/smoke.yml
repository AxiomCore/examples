name: Verify released Axiom examples

on:
  repository_dispatch:
    types: [axiom-release-verified]
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event.client_payload.train_id || github.ref }}
  cancel-in-progress: false

jobs:
  acore:
    name: Released CLI · backend and web Acore
    runs-on: macos-15
    timeout-minutes: 45
    env:
      AXIOM_CLOUD_URL: http://127.0.0.1:8000
      AXIOM_UI_WEB_NO_OPEN: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release selection
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install latest verified CLI and extractors
        run: |
          python scripts/install_released_toolchain.py \
            --bin-dir "$RUNNER_TEMP/axiom-bin" \
            --extractor-dir "$HOME/.acore/bin"
          "$RUNNER_TEMP/axiom-bin/axiom" --version
      - name: Install verified web UI host
        run: axiom ui host install --target web --non-interactive
      - name: Compile and exercise every Acore example
        run: python scripts/verify_acore_examples.py

  npm-web:
    name: npm web · ${{ matrix.example }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example:
          - simple-backend/frontend/atmx-web
          - simple-backend/frontend/atmx-react
          - offline-first-feed/frontend/atmx-web
          - realtime-chat/frontend/atmx-web
          - realtime-chat/frontend/atmx-react
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - name: Install locked packages
        run: npm ci --ignore-scripts
      - name: Build or type-check web frontend
        run: |
          if npm pkg get scripts.build | grep -qv '^{}$'; then
            npm run build
          else
            npx tsc --noEmit --lib dom,es2020 --moduleResolution bundler --module esnext generated/*.ts
            node --check generated/sdk.js
            node --check generated/models.js
          fi

  flutter-web:
    name: Flutter web · ${{ matrix.example }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example:
          - simple-backend/frontend/axiom_flutter_web
          - realtime-chat/frontend/axiom_flutter_web
          - rpc/example
          - stream/example
          - observability-and-auth/example
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve published packages
        run: flutter pub get
      - name: Run browser widget tests
        run: flutter test --platform chrome --no-pub
      - name: Build web frontend
        run: flutter build web --release --no-pub
