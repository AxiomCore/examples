format = "axiom-deps/v2"
targets = ["android", "ios", "web", "server"]

[extensions.pricing]
language = "python"
source = "pricing.py"
exports = ["calculate_discount"]
targets = ["android", "ios", "web", "server"]

[extensions.pricing.permissions.ui-state.cart]
read = ["subtotal_cents"]
write = ["discount_cents", "total_cents"]
