name: axiom_flutter_web
description: "AxiomCore Flutter example: register, log in and manage items on the simple-backend FastAPI service."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  axiom_flutter: ^0.150.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  axiom_flutter_generator: ^0.150.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# To build against an axiom-sdk checkout instead of pub.dev, put this in an
# (uncommitted) pubspec_overrides.yaml next to this file, or uncomment here:
# dependency_overrides:
#   axiom_flutter:
#     path: ../../../../axiom-sdk/flutter/axiom_flutter
#   axiom_flutter_generator:
#     path: ../../../../axiom-sdk/flutter/axiom_flutter_generator

flutter:
  uses-material-design: true
  assets:
    - assets/axiom/py-example.axiom
